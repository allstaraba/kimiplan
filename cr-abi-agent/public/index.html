<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>CentralReach ABI Expert</title>
<style>
  :root {
    --bg: #f6f7f9;
    --card: #ffffff;
    --border: #e5e7eb;
    --text: #111827;
    --muted: #6b7280;
    --accent: #2563eb;
    --accent-hover: #1d4ed8;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
    background: var(--bg);
    color: var(--text);
  }
  .app {
    max-width: 860px;
    margin: 0 auto;
    padding: 1rem;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
  }
  header {
    padding: 0.75rem 0;
    border-bottom: 1px solid var(--border);
    margin-bottom: 1rem;
  }
  h1 {
    margin: 0;
    font-size: 1.1rem;
    font-weight: 600;
  }
  .sub {
    color: var(--muted);
    font-size: 0.85rem;
    margin-top: 0.2rem;
  }
  #log {
    flex: 1;
    overflow-y: auto;
    padding-bottom: 1rem;
  }
  .msg {
    margin: 0.75rem 0;
    padding: 0.75rem 1rem;
    border-radius: 12px;
    line-height: 1.55;
    white-space: pre-wrap;
    word-wrap: break-word;
  }
  .msg.user {
    background: var(--accent);
    color: white;
    margin-left: 15%;
  }
  .msg.assistant {
    background: var(--card);
    border: 1px solid var(--border);
    margin-right: 15%;
  }
  .msg.system {
    background: #fef3c7;
    border: 1px solid #fde68a;
    font-size: 0.9rem;
    color: #78350f;
  }
  form {
    display: flex;
    gap: 0.5rem;
    padding: 0.5rem;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 12px;
    position: sticky;
    bottom: 0;
  }
  textarea {
    flex: 1;
    border: none;
    outline: none;
    resize: none;
    font-family: inherit;
    font-size: 1rem;
    padding: 0.5rem;
    min-height: 2.25rem;
    max-height: 10rem;
    background: transparent;
    color: var(--text);
  }
  button {
    background: var(--accent);
    color: white;
    border: none;
    padding: 0 1.1rem;
    border-radius: 8px;
    cursor: pointer;
    font-weight: 600;
    font-size: 0.95rem;
  }
  button:hover:not(:disabled) { background: var(--accent-hover); }
  button:disabled { opacity: 0.5; cursor: not-allowed; }
  .cursor::after {
    content: '▍';
    color: var(--muted);
    animation: blink 1s infinite;
  }
  @keyframes blink { 50% { opacity: 0; } }
</style>
</head>
<body>
<div class="app">
  <header>
    <h1>CentralReach ABI Expert</h1>
    <div class="sub" id="status">Loading...</div>
  </header>
  <div id="log"></div>
  <form id="chat">
    <textarea id="input" placeholder="Ask about ABI reports, filters, parameters, scheduling, widgets..." autofocus></textarea>
    <button type="submit" id="send">Send</button>
  </form>
</div>
<script>
const log = document.getElementById('log');
const form = document.getElementById('chat');
const input = document.getElementById('input');
const send = document.getElementById('send');
const status = document.getElementById('status');
const messages = [];

(async () => {
  try {
    const r = await fetch('/api/health');
    const j = await r.json();
    status.textContent = j.corpus > 0
      ? `Knowledge base loaded · ${j.corpus} articles indexed`
      : 'No knowledge base yet — run `npm run ingest` to build the corpus';
  } catch {
    status.textContent = 'Server unreachable';
  }
})();

function bubble(role) {
  const div = document.createElement('div');
  div.className = 'msg ' + role;
  log.appendChild(div);
  log.scrollTop = log.scrollHeight;
  return div;
}

async function sendMessage(text) {
  messages.push({ role: 'user', content: text });
  bubble('user').textContent = text;
  const out = bubble('assistant');
  out.classList.add('cursor');
  send.disabled = true;
  let acc = '';

  try {
    const r = await fetch('/api/chat', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ messages }),
    });
    if (!r.ok) throw new Error('HTTP ' + r.status);
    const reader = r.body.getReader();
    const decoder = new TextDecoder();
    let buf = '';
    while (true) {
      const { done, value } = await reader.read();
      if (done) break;
      buf += decoder.decode(value, { stream: true });
      const lines = buf.split('\n');
      buf = lines.pop();
      for (const line of lines) {
        if (!line.startsWith('data: ')) continue;
        const data = line.slice(6);
        if (data === '[DONE]') continue;
        try {
          const obj = JSON.parse(data);
          if (obj.delta) {
            acc += obj.delta;
            out.textContent = acc;
            log.scrollTop = log.scrollHeight;
          }
          if (obj.error) {
            out.classList.remove('cursor');
            out.textContent = 'Error: ' + obj.error;
            return;
          }
        } catch {}
      }
    }
    messages.push({ role: 'assistant', content: acc });
  } catch (err) {
    out.textContent = 'Error: ' + err.message;
  } finally {
    out.classList.remove('cursor');
    send.disabled = false;
    input.focus();
  }
}

form.addEventListener('submit', (e) => {
  e.preventDefault();
  const text = input.value.trim();
  if (!text) return;
  input.value = '';
  input.style.height = 'auto';
  sendMessage(text);
});

input.addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && !e.shiftKey) {
    e.preventDefault();
    form.requestSubmit();
  }
});

input.addEventListener('input', () => {
  input.style.height = 'auto';
  input.style.height = Math.min(input.scrollHeight, 160) + 'px';
});
</script>
</body>
</html>
