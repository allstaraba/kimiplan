name: Deploy to Railway

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy to Railway
        run: |
          DEPLOYMENT_ID=$(curl -s -X POST https://backboard.railway.app/graphql/v2 \
            -H "Content-Type: application/json" \
            -H "Project-Access-Token: ${{ secrets.RAILWAY_TOKEN }}" \
            -d '{"query": "mutation { deploymentRedeploy(id: \"48801869-a6a1-4f90-b233-b270fc91343e\") { id status } }"}' \
            | jq -r '.data.deploymentRedeploy.id')
          echo "Deployment triggered: $DEPLOYMENT_ID"
